apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-marketplace
  namespace: production  # Change to dev or staging as needed
spec:
  replicas: 3  # Number of desired pods for load balancing
  selector:
    matchLabels:
      app: fashion-marketplace
  template:
    metadata:
      labels:
        app: fashion-marketplace
    spec:
      containers:
        - name: fashion-marketplace
          image: your-docker-repo/fashion-marketplace:latest  # Use a specific version tag in production
          ports:
            - containerPort: 8000  # Expose the application on port 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret  # Reference to a Kubernetes secret for sensitive data
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret  # Reference to a Kubernetes secret for Redis
                  key: redis-url
            - name: ENVIRONMENT
              value: "production"  # Set the environment variable for the application
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret  # Reference to a Kubernetes secret for API keys
                  key: api-key
          resources:
            requests:
              memory: "256Mi"  # Minimum memory request
              cpu: "500m"  # Minimum CPU request
            limits:
              memory: "512Mi"  # Maximum memory limit
              cpu: "1"  # Maximum CPU limit
          livenessProbe:
            httpGet:
              path: /health  # Health check endpoint
              port: 8000
            initialDelaySeconds: 30  # Delay before the first probe
            periodSeconds: 10  # Frequency of the probe
            timeoutSeconds: 5  # Timeout for the probe
            failureThreshold: 3  # Number of failures before marking the pod as unhealthy
          readinessProbe:
            httpGet:
              path: /ready  # Readiness check endpoint
              port: 8000
            initialDelaySeconds: 15  # Delay before the first probe
            periodSeconds: 5  # Frequency of the probe
            timeoutSeconds: 3  # Timeout for the probe
            failureThreshold: 3  # Number of failures before marking the pod as not ready
      imagePullSecrets:
        - name: regcred  # Secret for pulling images from a private Docker registry
      strategy:
        type: RollingUpdate  # Use rolling updates for deployments
        rollingUpdate:
          maxUnavailable: 1  # Maximum number of pods that can be unavailable during the update
          maxSurge: 1  # Maximum number of pods that can be created above the desired number of pods
      nodeSelector:
        environment: production  # Node selector for environment-specific deployments
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "production"
          effect: "NoSchedule"  # Toleration for scheduling on dedicated nodes
      securityContext:
        runAsUser: 1000  # Run the container as a non-root user
        runAsGroup: 3000  # Run the container as a non-root group
        fsGroup: 2000  # Group ID for file system permissions
      affinity:
        podAntiAffinity:  # Anti-affinity rules to spread pods across nodes
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - fashion-marketplace
              topologyKey: "kubernetes.io/hostname"  # Spread pods across different nodes

# Note: Ensure that secrets are created in the Kubernetes cluster before deploying this configuration.
# Example command to create a secret:
# kubectl create secret generic db-secret --from-literal=database-url='your-database-url'
# kubectl create secret generic redis-secret --from-literal=redis-url='your-redis-url'
# kubectl create secret generic api-secret --from-literal=api-key='your-api-key'