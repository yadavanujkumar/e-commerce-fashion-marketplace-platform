name: CI Workflow for E-Commerce Fashion Marketplace

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter
        run: |
          pip install flake8
          flake8 . --max-line-length=120

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          pytest --maxfail=1 --disable-warnings -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build . -t my-ecommerce-app:${{ github.sha }} --build-arg ENV=${{ github.event_name }}

      - name: Push Docker image
        run: |
          docker push my-ecommerce-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to Production
        run: |
          echo "Deploying to Production environment..."
          # Add your deployment commands here, e.g., using SSH or a cloud provider CLI
          # Ensure you have the necessary secrets configured in GitHub Secrets

env:
  # Environment variables for different environments
  DEV_DB_URL: ${DEV_DB_URL}
  STAGING_DB_URL: ${STAGING_DB_URL}
  PROD_DB_URL: ${PROD_DB_URL}
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: false # Set to true for development, false for production

# Secrets should be configured in GitHub repository settings
# DOCKER_USERNAME and DOCKER_PASSWORD for Docker Hub access
# DEV_DB_URL, STAGING_DB_URL, PROD_DB_URL, SECRET_KEY should be set as environment variables in GitHub Secrets

# Performance tuning and resource limits can be configured in the Dockerfile or deployment scripts
# Security best practices include using least privilege for secrets and environment variables

# Example of how to set environment variables in GitHub Secrets:
# DEV_DB_URL: your_dev_db_url
# STAGING_DB_URL: your_staging_db_url
# PROD_DB_URL: your_prod_db_url
# SECRET_KEY: your_secret_key